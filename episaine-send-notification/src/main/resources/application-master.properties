spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:episaine}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:episaine}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:sent-notification-group}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

app.kafka.notifications-to-send-topic=${APP_KAFKA_NOTIFICATIONS_TO_SEND_TOPIC:notifications-to-send}
app.kafka.notifications-sent-topic=${APP_KAFKA_NOTIFICATIONS_SENT_TOPIC:notifications-sent}
