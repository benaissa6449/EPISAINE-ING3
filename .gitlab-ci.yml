stages:
  - build
  - deploy

build-job:
  stage: build
  tags: [episaine-cicd]
  only:
    - dev
  script:
    - echo "Hello, $GITLAB_USER_LOGIN!"
    - echo "Dummy job for now since nothing to build."

deploy-job:
  stage: deploy
  tags: [episaine-cicd]
  only:
    - dev
  script:
    - echo "Deployment started..."
    - bash scripts/deployment/deploy_etl.sh "$USER" "$Host_ETL"
    - echo "Deployment finished."
