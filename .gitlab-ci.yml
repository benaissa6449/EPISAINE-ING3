stages:
  - build
  - deploy

build-cache-loader:
  stage: build
  tags: [episaine-cicd]
  only:
    - main
  script:
    - echo "Building episaine-cache-loader..."
    - docker build -t episaine-cache-loader:latest ./episaine-cache-loader
    - echo "Build episaine-cache-loader done."

build-generate-notification:
  stage: build
  tags: [episaine-cicd]
  only:
    - main
  script:
    - echo "Building episaine-generate-notification..."
    - docker build -t episaine-generate-notification:latest ./episaine-generate-notification
    - echo "Build episaine-generate-notification done."

build-kafka-backend:
  stage: build
  tags: [episaine-cicd]
  only:
    - main
  script:
    - echo "Building episaine-kafka-backend..."
    - docker build -t episaine-kafka-backend:latest ./episaine-kafka-backend
    - echo "Build episaine-kafka-backend done."

build-static-front:
  stage: build
  tags: [episaine-cicd]
  only:
    - main
  script:
    - echo "Building episaine-static-front..."
    - docker build -t episaine-static-front:latest ./episaine-static-front
    - echo "Build episaine-static-front done."

build-send-notification:
  stage: build
  tags: [episaine-cicd]
  only:
    - main
  script:
    - echo "Building episaine-send-notification..."
    - docker build -t episaine-send-notification:latest ./episaine-send-notification
    - echo "Build episaine-send-notification done."

deploy-etl:
  stage: deploy
  tags: [episaine-cicd]
  only:
    - main
  script:
    - echo "Deploying ETL..."
    - bash scripts/deployment/deploy_etl.sh "$USER" "$Host_ETL"
    - echo "ETL deployment finished."

deploy-spark:
  stage: deploy
  tags: [episaine-cicd]
  only:
    - main
  script:
    - echo "Deploying Spark..."
    - bash scripts/deployment/deploy_spark.sh "$USER" "$Host_ETL"
    - echo "Spark deployment finished."

deploy-cache-loader:
  stage: deploy
  tags: [episaine-cicd]
  only:
    - main
  needs: [build-cache-loader]
  script:
    - echo "Deploying episaine-cache-loader..."
    - bash scripts/deployment/deploy_cache_loader.sh "$USER" "$Host_PSQL"
    - echo "Cache loader deployment finished."

deploy-generate-notification:
  stage: deploy
  tags: [episaine-cicd]
  only:
    - main
  needs: [build-generate-notification]
  script:
    - echo "Deploying episaine-generate-notification..."
    - bash scripts/deployment/deploy_generate_notification.sh "$USER" "$Host_NOTIFICATION"
    - echo "Notification deployment finished."

deploy-send-notification:
  stage: deploy
  tags: [episaine-cicd]
  only:
    - main
  needs: [build-send-notification]
  script:
    - echo "Deploying episaine-send-notification..."
    - bash scripts/deployment/deploy_send_notification.sh "$USER" "$Host_NOTIFICATION"
    - echo "Send notification deployment finished."

deploy-kafka-backend:
  stage: deploy
  tags: [episaine-cicd]
  only:
    - main
  needs: [build-kafka-backend]
  script:
    - echo "Deploying episaine-kafka-backend..."
    - bash scripts/deployment/deploy_kafka_backend.sh "$USER" "$Host_NOTIFICATION"
    - echo "Kafka backend deployment finished."

deploy-static-front:
  stage: deploy
  tags: [episaine-cicd]
  only:
    - main
  needs: [build-static-front]
  script:
    - echo "Deploying episaine-static-front..."
    - bash scripts/deployment/deploy_static_front.sh "$USER" "$Host_STATIC_FRONT"
    - echo "Static front deployment finished."

deploy-kafka-mock:
  stage: deploy
  tags: [episaine-cicd]
  only:
    - main
  script:
    - echo "Deploying kafka-mock..."
    - bash scripts/deployment/deploy_kafka_mock.sh "$USER" "$Host_KAFKA"
    - echo "Kafka mock deployment finished."

deploy-customers-mock:
  stage: deploy
  tags: [episaine-cicd]
  only:
    - main
  script:
    - echo "Deploying customers-mock..."
    - bash scripts/deployment/deploy_customers_mock.sh "$USER" "$Host_PSQL"
    - echo "Customers mock deployment finished."
