<VirtualHost *:80>
    ServerName _
    ServerAdmin admin@localhost
    DocumentRoot /var/www/episaine-front

    <Directory /var/www/episaine-front>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        # SPA fallback to index.html
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]
        RewriteRule ^ /index.html [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/episaine-front-error.log
    CustomLog ${APACHE_LOG_DIR}/episaine-front-access.log combined
</VirtualHost>
