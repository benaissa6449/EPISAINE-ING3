services:
  kafka-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: episaine-kafka-backend
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: 172.31.249.144:9092
      KAFKA_TOPIC: customer-profile
      KAFKA_GROUP_ID: frontend-stream-group-local
      APP_EVENTS_MAX_HISTORY: 5000
      CORS_ALLOWED_ORIGIN: "*"
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    extra_hosts:
      - "episaine:172.31.249.144"
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  episaine-front:
    build:
      context: ../episaine-static-front
      dockerfile: Dockerfile
    container_name: episaine-static-front
    restart: unless-stopped
    depends_on:
      - kafka-backend
    ports:
      - "3000:80"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
