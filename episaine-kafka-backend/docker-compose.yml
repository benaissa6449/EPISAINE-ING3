services:
  kafka-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: episaine-kafka-backend
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: 192.168.248.110:9092
      KAFKA_TOPIC: customer-profile
      KAFKA_GROUP_ID: frontend-stream-group
      CORS_ALLOWED_ORIGIN: "*"
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
