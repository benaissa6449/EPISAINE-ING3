global
    log stdout format raw local0
    maxconn 1024

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_front
    bind *:80
    redirect scheme https code 301 if !{ ssl_fc }

frontend https_front
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/haproxy.pem
    default_backend front_backend

backend front_backend
    balance roundrobin
    server episaine_static_front 192.168.248.106:3000 check
